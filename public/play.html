<!doctype html>
<html lang="en"><head>
<script>/* Light / dark mode + button ripples. Load in <head> so the theme is set before the page paints. */
(function () {
  var K = 'mf_theme', r = document.documentElement, t, btn;
  try { t = localStorage.getItem(K); } catch (e) {}
  if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  r.setAttribute('data-theme', t);
  function paint() {
    var m = document.querySelector('meta[name=theme-color]'); if (m) m.content = t === 'light' ? '#FEF3E2' : '#2A1A0E';
    if (btn) btn.setAttribute('aria-label', 'Switch to ' + (t === 'dark' ? 'light' : 'dark') + ' mode');
  }
  function set(n) {
    t = n; r.classList.add('tswap'); r.setAttribute('data-theme', n);
    try { localStorage.setItem(K, n); } catch (e) {}
    paint(); document.dispatchEvent(new CustomEvent('themechange', { detail: n }));
    setTimeout(function () { r.classList.remove('tswap'); }, 600);
  }
  window.mfTheme = { get: function () { return t; } };
  addEventListener('storage', function (e) { if (e.key === K && (e.newValue === 'light' || e.newValue === 'dark') && e.newValue !== t) set(e.newValue); });
  document.addEventListener('DOMContentLoaded', function () {
    btn = document.createElement('button'); btn.type = 'button'; btn.className = 'tg';
    btn.innerHTML = '<span class="k"></span><svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>';
    btn.onclick = function () { set(t === 'dark' ? 'light' : 'dark'); };
    var slot = document.getElementById('themeSlot');
    if (slot) slot.appendChild(btn); else { btn.classList.add('fl'); document.body.appendChild(btn); }
    paint();
  });
  document.addEventListener('pointerdown', function (e) {
    var el = e.target.closest && e.target.closest('button,.btn,.chip,.tab a,.q,.role'); if (!el || el.disabled) return;
    var b = el.getBoundingClientRect(), s = Math.max(b.width, b.height) * 2.2, d = document.createElement('span');
    d.className = 'rip'; d.style.cssText = 'width:' + s + 'px;height:' + s + 'px;left:' + (e.clientX - b.left - s / 2) + 'px;top:' + (e.clientY - b.top - s / 2) + 'px';
    el.appendChild(d); setTimeout(function () { d.remove(); }, 700);
  }, { passive: true });
})();
</script><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="var(--bg)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2215%22 fill=%22%232A1A0E%22/%3E%3Cpath fill-rule=%22evenodd%22 fill=%22%23F4AE52%22 transform=%22translate(-1 8) scale(.78)%22 d=%22M11 14H27C34 14 38 18 38 23.5C38 28 35.5 30.5 32 31.5C36.5 32.5 40 35.5 40 41C40 47 35.5 50 28 50H11ZM19 20.5V27.5H26C29.5 27.5 31 26 31 24C31 22 29.5 20.5 26 20.5ZM19 34.5V43.5H27C31 43.5 32.5 42 32.5 39C32.5 36 31 34.5 27 34.5Z%22/%3E%3Ccircle cx=%2245.5%22 cy=%2233%22 r=%2210%22 fill=%22none%22 stroke=%22%23D4621A%22 stroke-width=%227%22/%3E%3C/svg%3E" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Manhunt Fitness</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="style.css">
<style>/* Palette: cream #FEF3E2 · amber #F4AE52 · burnt orange #D4621A · dark brown #2A1A0E */
:root[data-theme="dark"]{--bg:#2A1A0E;--card:#38251A;--inp:#21130A;--line:rgba(254,243,226,.16);--tx:#FEF3E2;--mu:#D2BFA5;--or:#F4AE52;--yl:#D4621A;--ort:#E8803A;--ylt:#F4AE52;--onp:#2A1A0E;--bad:#FF9A78;color-scheme:dark}
:root[data-theme="light"]{--bg:#FEF3E2;--card:#FFF9F1;--inp:#FFFFFF;--line:rgba(42,26,14,.16);--tx:#2A1A0E;--mu:#6B5443;--or:#F4AE52;--yl:#D4621A;--ort:#A94A10;--ylt:#8A5A12;--onp:#2A1A0E;--bad:#B3261E;color-scheme:light}
html{background:var(--bg)}
.tswap,.tswap *{transition:background-color .5s ease,color .5s ease,border-color .5s ease,fill .5s ease,stroke .5s ease,box-shadow .5s ease!important}

/* theme switch */
.tg{all:unset;box-sizing:border-box;position:relative;width:58px;height:32px;border-radius:99px;background:var(--card);box-shadow:inset 0 0 0 1.5px var(--line);cursor:pointer;display:inline-flex;align-items:center;justify-content:space-between;padding:0 8px;color:var(--mu);flex:none;transition:transform .4s cubic-bezier(.34,1.56,.64,1),box-shadow .3s!important}
.tg svg{width:15px;height:15px;position:relative;z-index:1;transition:color .3s}
.tg .k{position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:var(--or);box-shadow:0 2px 8px rgba(42,26,14,.35);transition:transform .5s cubic-bezier(.34,1.56,.64,1)}
:root[data-theme="dark"] .tg .k{transform:translateX(26px)}
:root[data-theme="light"] .tg svg.sun,:root[data-theme="dark"] .tg svg.moon{color:var(--onp)}
.tg:hover{transform:scale(1.06)}.tg:active{transform:scale(.92)}.tg:focus-visible{outline:2px solid var(--yl);outline-offset:3px}
.tg.fl{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:14px;z-index:9998}

/* smooth, springy buttons with a ripple */
button,.btn,.chip,.tab a,.q,.mapbtn,.role{position:relative;overflow:hidden;-webkit-tap-highlight-color:transparent;transition:transform .45s cubic-bezier(.34,1.56,.64,1),box-shadow .4s ease,background-color .3s ease,color .3s ease,filter .3s ease,opacity .3s ease!important}
@media (hover:hover){
  .btn:hover,button:not(.q):not(.mapbtn):not(.tg):not(:disabled):hover,.chip:hover,.role:hover{transform:translateY(-2px) scale(1.03)!important;box-shadow:0 12px 30px color-mix(in srgb,var(--yl) 38%,transparent)}
  .tab a:hover{transform:translateY(-1px)}
}
.btn:active,button:not(.q):not(.tg):not(:disabled):active,.chip:active,.role:active,.tab a:active{transform:scale(.94)!important;transition-duration:.12s!important;box-shadow:none}
button:disabled{cursor:not-allowed}
.rip{position:absolute;border-radius:50%;background:currentColor;opacity:.28;transform:scale(0);animation:rip .65s cubic-bezier(.2,.7,.3,1) forwards;pointer-events:none}
@keyframes rip{to{transform:scale(1);opacity:0}}
:focus-visible{outline:2px solid var(--yl);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}.btn:hover,button:hover{transform:none!important}}
</style>
</head><body>
<div id="toast"></div>
<div id="sheet" class="sheet"><div class="in" id="sheetIn"></div></div>
<section id="home" class="scr on">
  <small>Manhunt Fitness</small>
  <h1>Ready to <span>hunt?</span></h1>
  <input id="name" placeholder="Your name" maxlength="14">
  <button id="create">Create new game</button>
  <div class="row"><input id="code" placeholder="Join code" maxlength="6"><button class="o" id="join">Join</button></div>
</section>

<section id="lobby" class="scr">
  <small>Share this code</small><h1 id="lcode" class="yl"></h1>
  <button class="o" id="share">Share invite link</button>
  <div id="plist"></div>
  <div class="card" id="rulesBox">
    <div class="or" style="font-size:12px;letter-spacing:1px">GAME RULES</div>
    <svg id="prev" viewBox="0 0 200 200" role="img" aria-label="Zone preview"><circle cx="100" cy="100" r="96" fill="var(--inp)"/><circle id="pOut" cx="100" cy="100" r="60" fill="rgba(212,98,26,.08)" stroke="var(--or)" stroke-width="3"/><circle id="pIn" cx="100" cy="100" r="20" fill="none" stroke="var(--yl)" stroke-width="2" stroke-dasharray="6 5"/></svg>
    <label class="rg"><span>Round length <b id="v-round"></b></span><input type="range" id="r-round" min="5" max="180" step="5"></label>
    <label class="rg"><span>Ping every <b id="v-ping"></b></span><input type="range" id="r-ping" min="0" max="30" step="1"></label>
    <label class="rg"><span>Head start <b id="v-head"></b></span><input type="range" id="r-head" min="0" max="30" step="1"></label>
    <label class="rg"><span>Zone size (width) <b id="v-zone"></b></span><input type="range" id="r-zone" min="200" max="3000" step="20"></label>
    <label class="rg chk"><input type="checkbox" id="r-shrink"><span>Zone shrinks during the round</span></label>
    <label class="rg" id="finalRow"><span>Final zone size <b id="v-final"></b></span><input type="range" id="r-final" min="100" max="1500" step="20"></label>
  </div>
  <button id="start" style="display:none">Start game</button>
  <p class="mu" id="lhint">Waiting for the host to start...</p>
</section>

<section id="game" class="scr">
  <div class="top"><span id="role" class="chip a"></span><b id="clock" class="yl"></b></div>
  <div id="banner" class="banner"></div>
  <div id="map"></div>
  <div class="card"><div id="info"></div></div>
  <div class="row">
    <div class="st"><b id="tm">00:00</b><span>TIMER</span></div>
    <div class="st"><b id="kc" class="or">0</b><span>KCAL</span></div>
    <div class="st"><b id="ds">0</b><span>METRES</span></div>
  </div>
  <div id="modes"><span class="chip a" data-m="run">Run</span><span class="chip" data-m="walk">Walk</span><span class="chip" data-m="ride">Ride</span></div>
  <button id="tagBtn" style="display:none">Tag a runner</button>
</section>

<section id="end" class="scr">
  <div class="c"><span class="chip a" id="eTag">ROUND OVER</span><h1 id="eTitle" class="yl"></h1><p class="mu" id="eSub"></p></div>
  <div class="row"><div class="st"><b id="eD">0</b><span>METRES</span></div><div class="st"><b id="eK" class="or">0</b><span>KCAL</span></div><div class="st"><b id="eT">0</b><span>MINUTES</span></div></div>
  <div class="row" style="margin-top:10px"><div class="st"><b id="eP">--</b><span>PACE /KM</span></div><div class="st"><b id="eF" class="or">0</b><span>RUNNERS TAGGED</span></div></div>
  <div class="card" style="margin-top:12px"><div class="mu" style="font-size:12px;letter-spacing:1px;margin-bottom:8px">RESULTS</div><div id="eList"></div></div>
  <button id="again">Back to home</button>
</section>
<script type="module" src="app.js"></script>
<script src="topo.js" defer></script>
</body></html>
