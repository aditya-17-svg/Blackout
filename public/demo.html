<!doctype html>
<html lang="en"><head><script>
(function () {
  var K = 'mf_theme', r = document.documentElement, t, btn;
  try { t = localStorage.getItem(K); } catch (e) {}
  if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  r.setAttribute('data-theme', t);
  function paint() {
    var m = document.querySelector('meta[name=theme-color]'); if (m) m.content = t === 'light' ? '#FEF3E2' : '#2A1A0E';
    if (btn) btn.setAttribute('aria-label', 'Switch to ' + (t === 'dark' ? 'light' : 'dark') + ' mode');
  }
  function set(n) {
    t = n; r.classList.add('tswap'); r.setAttribute('data-theme', n);
    try { localStorage.setItem(K, n); } catch (e) {}
    paint(); document.dispatchEvent(new CustomEvent('themechange', { detail: n }));
    setTimeout(function () { r.classList.remove('tswap'); }, 600);
  }
  window.mfTheme = { get: function () { return t; } };
  addEventListener('storage', function (e) { if (e.key === K && (e.newValue === 'light' || e.newValue === 'dark') && e.newValue !== t) set(e.newValue); });
  document.addEventListener('DOMContentLoaded', function () {
    btn = document.createElement('button'); btn.type = 'button'; btn.className = 'tg';
    btn.innerHTML = '<span class="k"></span><svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>';
    btn.onclick = function () { set(t === 'dark' ? 'light' : 'dark'); };
    var slot = document.getElementById('themeSlot');
    if (slot) slot.appendChild(btn); else { btn.classList.add('fl'); document.body.appendChild(btn); }
    paint();
  });
})();
</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2A1A0E">
<title>Blackout – Live demo with Abilities</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font-family:-apple-system,'SF Pro Text','Segoe UI',Roboto,sans-serif}
#app{max-width:440px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 14px calc(20px + env(safe-area-inset-bottom))}
.scr{display:none}.scr.on{display:block}
small,.mu{color:var(--mu)}h1{font-size:clamp(28px,8vw,36px);margin:4px 0 6px;font-weight:900;letter-spacing:-.03em}
.g{background:linear-gradient(90deg,var(--ort),var(--ylt));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mu);margin:0 0 14px;font-size:14px;line-height:1.4}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.role{all:unset;box-sizing:border-box;cursor:pointer;background:var(--card);border-radius:22px;padding:14px;box-shadow:inset 0 0 0 1.5px var(--line);display:block;text-align:left}
.role b{display:block;font-size:19px;margin:8px 0 4px}.role span{font-size:12.5px;color:var(--mu);line-height:1.35;display:block}
.role i{display:flex;width:34px;height:34px;border-radius:50%;align-items:center;justify-content:center;font-style:normal;font-weight:900;color:var(--onp);background:var(--or)}
.role[data-r=seeker] i{background:var(--yl);color:#FEF3E2}
.role.on{box-shadow:inset 0 0 0 2.5px var(--yl);background:color-mix(in srgb,var(--yl) 10%,var(--card))}
.card{background:var(--card);border-radius:20px;padding:12px 14px;margin:12px 0;font-size:13px}
.lob{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.lob span{padding:5px 11px;border-radius:99px;background:var(--bg);font-weight:700;font-size:12px;box-shadow:inset 0 0 0 1px var(--line)}
button.btn{display:block;width:100%;height:52px;border:0;border-radius:99px;background:var(--or);color:var(--onp);font-size:16px;font-weight:800;cursor:pointer;margin-top:8px}
button.btn.o{background:transparent;color:var(--ylt);box-shadow:inset 0 0 0 2px var(--yl)}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;padding-right:68px}.top b{font-size:26px;color:var(--ylt);font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:6px 12px;border-radius:99px;font-weight:800;font-size:12px;background:var(--or);color:var(--onp)}.pill.s{background:var(--yl);color:#FEF3E2}
#map{height:clamp(280px,46dvh,500px);border-radius:22px;background:var(--inp)}
.row{display:flex;gap:8px;margin-top:10px}.st{flex:1;background:var(--card);border-radius:16px;padding:10px 12px}.st b{display:block;font-size:20px;color:var(--ylt)}.st span{font-size:10px;letter-spacing:1px;color:var(--mu)}
#info{font-weight:800;font-size:14.5px}
#end{position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 94%,transparent);z-index:9000;display:none;align-items:center;justify-content:center;text-align:center;padding:24px}#end.on{display:flex}
#toast{position:fixed;top:calc(10px + env(safe-area-inset-top));left:50%;transform:translate(-50%,-90px);background:var(--or);color:var(--onp);font-weight:800;padding:10px 16px;border-radius:16px;z-index:9999;transition:.35s;max-width:90%;text-align:center;font-size:14px}#toast.on{transform:translate(-50%,0)}
.zpill{position:relative;overflow:hidden;margin:10px 0 0!important;padding:8px 18px 9px;border-radius:16px;text-align:center;background:color-mix(in srgb,var(--bg) 84%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 4px 18px rgba(0,0,0,.25);min-width:150px}
.zpill small{display:block;font-size:10px;letter-spacing:.12em;font-weight:800;color:var(--mu)}.zpill b{display:block;font-size:22px;font-weight:900;color:var(--ylt)}

/* Abilities HUD */
.ab-hud{display:flex;gap:8px;justify-content:center;margin:10px 0}
.ab-hud button{all:unset;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;width:48px;height:48px;border-radius:50%;background:var(--card);border:1.5px solid var(--yl);font-size:18px;cursor:pointer}
.ab-hud button.act{animation:zw .8s infinite;background:var(--or)}
</style></head><body><div id="app"><div id="toast"></div>
<div class="scr on" id="pick">
 <small>Live demo · plays on your real location</small>
 <h1>Join the <span class="g">hunt</span></h1>
 <p class="sub">Dynamic Safe Zones &amp; Special Abilities are active in all matches.</p>
 <div class="roles">
  <button class="role on" data-r="hider" type="button"><i>H</i><b>Hider</b><span>Ghost, Decoy, Sprint &amp; Radar Jammer equipped.</span></button>
  <button class="role" data-r="seeker" type="button"><i>S</i><b>Seeker</b><span>Sonar Pulse scan &amp; Sprint Surge equipped.</span></button>
 </div>
 <button class="btn" id="go" type="button" style="margin-top:14px">Start Match</button>
</div>
<div class="scr" id="game">
 <div class="top"><span class="pill" id="role">HIDER</span><b id="clock">2:30</b></div>
 <div id="map"></div>
 <div class="ab-hud" id="abHud">
  <button id="ab1" type="button" title="Ghost / Sonar">👻</button>
  <button id="ab2" type="button" title="Decoy Signal">📍</button>
  <button id="ab3" type="button" title="Sprint Boost">⚡</button>
 </div>
 <div class="card" style="margin:6px 0 0"><div id="info"></div></div>
 <div class="row"><div class="st"><b id="gt">00:00</b><span>TIMER</span></div><div class="st"><b id="gd">0 m</b><span>DISTANCE</span></div><div class="st"><b id="gk">0</b><span>KCAL</span></div></div>
 <button class="btn o" id="tag" type="button" style="display:none">Tag nearby hider</button>
</div>
<div id="end"><div style="max-width:340px;width:100%"><span class="pill" id="eTag">ROUND OVER</span><h1 id="eTitle" class="g" style="margin:14px 0 6px"></h1><p class="mu" id="eSub"></p><button class="btn" id="again" type="button" style="margin-top:16px">Play again</button></div></div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const $=i=>document.getElementById(i),R=Math.random,A='#F4AE52',B='#D4621A',D='#2A1A0E';
const DUR=150,LEN=DUR/4,SHR=10,ST=[420,290,180,100],FINAL=ST[3],MLAT=110540;
let role='hider',map,layer,c0,MLNG,zone,redZ=[],me={x:0,y:0},tgt=null,bots=[],run=false,t=0,last=0,dist=0,outT=0,nextPing=20,mk={},pm=[],ghost=false,boost=1;
const ll=(x,y)=>[c0[0]+y/MLAT,c0[1]+x/MLNG],xy=(p)=>({x:(p.lng-c0[1])*MLNG,y:(p.lat-c0[0])*MLAT});
const toast=m=>{const e=$('toast');e.textContent=m;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),2300)};
const show=n=>document.querySelectorAll('.scr').forEach(s=>s.classList.toggle('on',s.id===n));
const mmss=s=>{s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
document.querySelectorAll('.role').forEach(b=>b.onclick=()=>{role=b.dataset.r;document.querySelectorAll('.role').forEach(x=>x.classList.toggle('on',x===b))});

const radius=()=>{const i=Math.min(3,Math.floor(t/LEN)),n=Math.min(3,i+1),into=t-i*LEN,s=LEN-SHR;return into<=s||i===n?ST[i]:ST[i]+(ST[n]-ST[i])*((into-s)/SHR)};
const puck=(p,c)=>L.marker(p,{icon:L.divIcon({className:'puck',html:'<i style="background:'+c+'"></i>',iconSize:[22,22]}),interactive:false}).addTo(map);

function begin(){
 c0=[37.7749,-122.4194]; MLNG=111320*Math.cos(c0[0]*Math.PI/180); show('game');
 if(map)map.remove();
 map=L.map('map',{zoomControl:false}).setView(c0,16);
 L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}',{maxZoom:20}).addTo(map);
 zone=L.circle(c0,{radius:ST[0],color:B,weight:4,fillColor:B,fillOpacity:.08}).addTo(map);
 
 // Dynamic Red Hazard Zones inside safe perimeter
 redZ=[L.circle(ll(90,80),{radius:45,color:'#B3261E',weight:2,fillColor:'#B3261E',fillOpacity:.25}).addTo(map),
       L.circle(ll(-110,-90),{radius:40,color:'#B3261E',weight:2,fillColor:'#B3261E',fillOpacity:.25}).addTo(map)];

 map.on('click',e=>{if(run)tgt=xy(e.latlng)});
 me={x:0,y:0};tgt=null;t=0;dist=0;nextPing=20;ghost=false;boost=1;
 bots=role==='hider'?[{x:120,y:100,tagged:false}]:[{x:110,y:90,tagged:false},{x:-100,y:120,tagged:false}];
 mk.me=puck(ll(0,0),role==='hider'?A:B);mk.bots=bots.map(b=>puck(ll(b.x,b.y),role==='hider'?B:A));
 if(role==='seeker')mk.bots.forEach(m=>m.getElement().style.display='none');
 $('role').textContent=role.toUpperCase();$('tag').style.display=role==='seeker'?'block':'none';
 $('ab1').textContent=role==='seeker'?'🔍':'👻';
 run=true;last=performance.now();requestAnimationFrame(loop);
 toast('Tactical match started! Tap map to run.');
}
$('go').onclick=begin;

// Abilities triggers
$('ab1').onclick=()=>{
 if(role==='seeker'){nextPing=0;toast('🔍 SONAR SCAN: Hiders revealed!');}
 else{ghost=true;$('ab1').classList.add('act');toast('👻 GHOST: Invisible for 10s');setTimeout(()=>{ghost=false;$('ab1').classList.remove('act');},10000);}
};
$('ab2').onclick=()=>{
 pm.forEach(x=>x.remove()); pm=[puck(ll(me.x+120,me.y+100),A)]; toast('📍 DECOY: False ping deployed!');
};
$('ab3').onclick=()=>{
 boost=1.6;$('ab3').classList.add('act');toast('⚡ SPRINT BOOST ACTIVE!');
 setTimeout(()=>{boost=1;$('ab3').classList.remove('act');},8000);
};

function loop(now){
 if(!run)return;
 const dt=Math.min(.1,(now-last)/1000);last=now;t+=dt;const r=radius();
 if(tgt){const dx=tgt.x-me.x,dy=tgt.y-me.y,d=Math.hypot(dx,dy);if(d>2){const sp=(role==='hider'?6:5)*boost*dt;me.x+=dx/d*sp;me.y+=dy/d*sp;dist+=sp}}
 bots.forEach(b=>{if(b.tagged)return;if(role==='hider'){const dx=me.x-b.x,dy=me.y-b.y,d=Math.hypot(dx,dy);b.x+=dx/d*4.4*dt;b.y+=dy/d*4.4*dt}});
 if(role==='seeker'){
   nextPing-=dt;
   if(nextPing<=0){
     nextPing=20;pm.forEach(x=>x.remove());
     if(!ghost)pm=bots.filter(b=>!b.tagged).map(b=>puck(ll(b.x,b.y),A));
     toast('PING! Hiders located');
   }
 }
 zone.setRadius(r);mk.me.setLatLng(ll(me.x,me.y));
 if(role==='hider'&&!ghost)mk.bots.forEach((m,i)=>m.setLatLng(ll(bots[i].x,bots[i].y)));
 $('clock').textContent=mmss(DUR-t);$('gt').textContent=mmss(t);$('gd').textContent=Math.round(dist)+' m';
 $('info').innerHTML=role==='hider'?'<span style="color:var(--ort)">SEEKER LIVE</span> · '+(ghost?'[GHOST ACTIVE]':'visible'):'<span style="color:var(--ylt)">NEXT PING</span> in '+Math.ceil(nextPing)+' s';
 requestAnimationFrame(loop);
}
$('tag').onclick=()=>{bots.forEach(b=>b.tagged=true);toast('Tagged!');};
$('again').onclick=()=>{$('end').classList.remove('on');show('pick')};
</script></body></html>
