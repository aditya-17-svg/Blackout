<div class="scr on" id="pick">

<script>
const $=i=>document.getElementById(i),R=Math.random,A='#F4AE52',B='#D4621A',D='#2A1A0E';
const DUR=150,LEN=DUR/4,SHR=10,ST=[420,290,180,100],FINAL=ST[3],MLAT=110540;
const Q=new URLSearchParams(location.search),MET={run:9.8,walk:3.8,ride:7.5}[Q.get('mode')]||9.8;
let role='hider',map,layer,c0,MLNG,zone,me={x:0,y:0},tgt=null,bots=[],run=false,t=0,last=0,dist=0,outT=0,nextPing=20,mk={},pm=[];
const ll=(x,y)=>[c0[0]+y/MLAT,c0[1]+x/MLNG],xy=(p)=>({x:(p.lng-c0[1])*MLNG,y:(p.lat-c0[0])*MLAT});
const toast=m=>{const e=$('toast');e.textContent=m;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),2300)};
const show=n=>document.querySelectorAll('.scr').forEach(s=>s.classList.toggle('on',s.id===n));
const mmss=s=>{s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
document.querySelectorAll('.role').forEach(b=>b.onclick=()=>{role=b.dataset.r;document.querySelectorAll('.role').forEach(x=>x.classList.toggle('on',x===b))});
if(Q.get('role')==='seeker'){role='seeker';document.querySelectorAll('.role').forEach(x=>x.classList.toggle('on',x.dataset.r==='seeker'))}
const radius=()=>{const i=Math.min(3,Math.floor(t/LEN)),n=Math.min(3,i+1),into=t-i*LEN,s=LEN-SHR;return into<=s||i===n?ST[i]:ST[i]+(ST[n]-ST[i])*((into-s)/SHR)};
const puck=(p,c)=>L.marker(p,{icon:L.divIcon({className:'puck',html:'<i style="background:'+c+'"></i>',iconSize:[22,22]}),interactive:false}).addTo(map);
const BASES={light:'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',dark:'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png'};
function setBase(){if(!map)return;if(layer)layer.remove();layer=L.tileLayer(BASES[window.mfTheme.get()],{subdomains:'abcd',maxZoom:20,attribution:'&copy; OpenStreetMap &copy; CARTO'}).addTo(map);layer.bringToBack()}
document.addEventListener('themechange',setBase);
function locate(cb){if(!navigator.geolocation)return cb(null);let d=false;const f=v=>{if(!d){d=true;cb(v)}};navigator.geolocation.getCurrentPosition(p=>f([p.coords.latitude,p.coords.longitude]),()=>f(null),{timeout:7000,maximumAge:60000});setTimeout(()=>f(null),7500)}
$('go').onclick=()=>{$('go').disabled=true;$('note').textContent='Finding your location...';locate(p=>{$('go').disabled=false;
 if(p){c0=p;$('note').textContent=''}else{c0=[37.7749,-122.4194];$('note').textContent='Location is off, so the demo uses San Francisco. Allow location to play where you are.'}
 begin()})};
function begin(){MLNG=111320*Math.cos(c0[0]*Math.PI/180);show('game');
 if(map)map.remove();
 map=L.map('map',{zoomControl:false,dragging:false,scrollWheelZoom:false,doubleClickZoom:false,touchZoom:false,boxZoom:false,keyboard:false,tap:false});
 map.fitBounds(L.latLng(c0).toBounds(ST[0]*2),{padding:[8,8]});setBase();
 const zc=L.control({position:'topleft'});zc.onAdd=()=>{const d=L.DomUtil.create('div','zpill');d.id='zpill';return d};zc.addTo(map);
 zone=L.circle(c0,{radius:ST[0],color:B,weight:4,fillColor:B,fillOpacity:.08,interactive:false}).addTo(map);
 // final safe zone: fixed dotted ring (where the orange circle will stop)
 L.circle(c0,{radius:FINAL,color:D,weight:5,opacity:.5,fillOpacity:0,interactive:false}).addTo(map);
 L.circle(c0,{radius:FINAL,color:A,weight:3,dashArray:'8 8',fillOpacity:0,interactive:false}).addTo(map);
 L.marker(ll(0,FINAL),{icon:L.divIcon({className:'zl',html:'<span>FINAL SAFE ZONE</span>',iconSize:[0,0]}),interactive:false}).addTo(map);
 map.on('click',e=>{if(run)tgt=xy(e.latlng)});
 me={x:0,y:0};tgt=null;t=0;dist=0;outT=0;nextPing=20;pm.forEach(x=>x.remove());pm=[];
 const spawn=()=>{const g=R()*6.28,d=110+R()*140;return{x:Math.cos(g)*d,y:Math.sin(g)*d,tx:0,ty:0,tt:0,tagged:false}};
 bots=role==='hider'?[spawn()]:[spawn(),spawn()];

function end(win,title,sub){run=false;$('eTitle').textContent=title;$('eSub').textContent=sub;$('eTag').textContent=win?'VICTORY':'ROUND OVER';$('eD').textContent=Math.round(dist);$('eK').textContent=Math.round(MET*70*t/3600);$('end').classList.add('on')}

function zoneTimer(){ // PUBG-style countdown
 const i=Math.min(3,Math.floor(t/LEN)),into=t-i*LEN,st=LEN-SHR;
 if(i===3)return['','<small>FINAL ZONE</small><b>Stay in the dotted ring</b>'];
 if(into<st)return[st-into<=10?' warn':'','<small>ZONE SHRINKS IN</small><b>'+mmss(st-into)+'</b>'];
 return[' go','<small>ZONE CLOSING</small><b>'+mmss(LEN-into)+'</b><i style="width:'+Math.round((into-st)/SHR*100)+'%"></i>']}

 if(tgt){const px=me.x,py=me.y;const d=step(me,tgt.x,tgt.y,role==='hider'?6:5,dt);dist+=Math.hypot(me.x-px,me.y-py);if(d<1.5)tgt=null}

 if(role==='hider')mk.bots.forEach((m,i)=>m.setLatLng(ll(bots[i].x,bots[i].y)));else mk.bots.forEach((m,i)=>{if(bots[i].tagged)m.getElement().style.display='none'});
 const rem=DUR-t;$('clock').textContent=mmss(rem);$('gt').textContent=String(Math.floor(t/60)).padStart(2,'0')+':'+String(Math.floor(t%60)).padStart(2,'0');$('gd').textContent=Math.round(dist)+' m';$('gk').textContent=Math.round(MET*70*t/3600);

</script>
<style>/* Palette: cream #FEF3E2 · amber #F4AE52 · burnt orange #D4621A · dark brown #2A1A0E */
:root[data-theme="dark"]{--bg:#2A1A0E;--card:#38251A;--inp:#21130A;--line:rgba(254,243,226,.16);--tx:#FEF3E2;--mu:#D2BFA5;--or:#F4AE52;--yl:#D4621A;--ort:#E8803A;--ylt:#F4AE52;--onp:#2A1A0E;--bad:#FF9A78;color-scheme:dark}
:root[data-theme="light"]{--bg:#FEF3E2;--card:#FFF9F1;--inp:#FFFFFF;--line:rgba(42,26,14,.16);--tx:#2A1A0E;--mu:#6B5443;--or:#F4AE52;--yl:#D4621A;--ort:#A94A10;--ylt:#8A5A12;--onp:#2A1A0E;--bad:#B3261E;color-scheme:light}
html{background:var(--bg)}
.tswap,.tswap *{transition:background-color .5s ease,color .5s ease,border-color .5s ease,fill .5s ease,stroke .5s ease,box-shadow .5s ease!important}

/* theme switch */
.tg{all:unset;box-sizing:border-box;position:relative;width:58px;height:32px;border-radius:99px;background:var(--card);box-shadow:inset 0 0 0 1.5px var(--line);cursor:pointer;display:inline-flex;align-items:center;justify-content:space-between;padding:0 8px;color:var(--mu);flex:none;transition:transform .4s cubic-bezier(.34,1.56,.64,1),box-shadow .3s!important}
.tg svg{width:15px;height:15px;position:relative;z-index:1;transition:color .3s}
.tg .k{position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:var(--or);box-shadow:0 2px 8px rgba(42,26,14,.35);transition:transform .5s cubic-bezier(.34,1.56,.64,1)}
:root[data-theme="dark"] .tg .k{transform:translateX(26px)}
:root[data-theme="light"] .tg svg.sun,:root[data-theme="dark"] .tg svg.moon{color:var(--onp)}
.tg:hover{transform:scale(1.06)}.tg:active{transform:scale(.92)}.tg:focus-visible{outline:2px solid var(--yl);outline-offset:3px}
.tg.fl{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:14px;z-index:9998}

/* smooth, springy buttons with a ripple */
button,.btn,.chip,.tab a,.q,.mapbtn,.role{position:relative;overflow:hidden;-webkit-tap-highlight-color:transparent;transition:transform .45s cubic-bezier(.34,1.56,.64,1),box-shadow .4s ease,background-color .3s ease,color .3s ease,filter .3s ease,opacity .3s ease!important}
@media (hover:hover){
  .btn:hover,button:not(.q):not(.mapbtn):not(.tg):not(:disabled):hover,.chip:hover,.role:hover{transform:translateY(-2px) scale(1.03)!important;box-shadow:0 12px 30px color-mix(in srgb,var(--yl) 38%,transparent)}
  .tab a:hover{transform:translateY(-1px)}
}
.btn:active,button:not(.q):not(.tg):not(:disabled):active,.chip:active,.role:active,.tab a:active{transform:scale(.94)!important;transition-duration:.12s!important;box-shadow:none}
button:disabled{cursor:not-allowed}
.rip{position:absolute;border-radius:50%;background:currentColor;opacity:.28;transform:scale(0);animation:rip .65s cubic-bezier(.2,.7,.3,1) forwards;pointer-events:none}
@keyframes rip{to{transform:scale(1);opacity:0}}
:focus-visible{outline:2px solid var(--yl);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}.btn:hover,button:hover{transform:none!important}}
</style>
</body></html>
